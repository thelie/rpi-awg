# dnsmasq config for domain-based VPN bypass
# Listens on port 5353, used by AdGuard for *.ru forwarding

port=5353
listen-address=0.0.0.0
bind-interfaces
no-resolv
no-hosts
cache-size=1000

# Upstream DNS for resolving bypassed domains
# __UPSTREAM_DNS__ is replaced by entrypoint.sh with $GATEWAY_IP
server=__UPSTREAM_DNS__

# Add resolved IPs to the bypass ipset
# --- Russian TLD ---
ipset=/.ru/bypass_domains

# --- GitHub ---
ipset=/.github.com/.github.io/.githubusercontent.com/.githubassets.com/.ghcr.io/bypass_domains

# --- Reddit ---
ipset=/.reddit.com/.redd.it/.redditmedia.com/.redditstatic.com/bypass_domains

# --- Apple (captive portal) ---
ipset=/captive.apple.com/bypass_domains

# --- Russian services with non-.ru CDN domains ---
ipset=/.vk.com/.vk.me/.vkuseraudio.net/.vkuservideo.net/.userapi.com/bypass_domains
ipset=/.yandex.net/.yandex.com/.ya.ru/.yastatic.net/bypass_domains

# --- Steam (game downloads) ---
ipset=/.steampowered.com/.steamcontent.com/.steamstatic.com/.steamusercontent.com/.steamgames.com/.steam-chat.com/bypass_domains
